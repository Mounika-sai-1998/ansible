- name: default value
  hosts: localhost
  tasks:
  - name: for default value
    ansible.builtin.debug:
      msg: Hello , {{ course | default('Ansible') }}

- name: Upper case
  hosts: localhost
  vars:
    greetings: "Good Morning"
  tasks:
  - name: filter to upper case
    ansible.builtin.debug:
      msg: "Hello , {{ greetings | upper }}"

- name: lower case
  hosts: localhost
  vars:
    greetings: Good Morning
  tasks: 
  - name: filter to lower case
    ansible.builtin.debug:
      msg: "Hello , {{ greetings | lower }}"

- name: duplicate numbers
  hosts: local hosts
  vars:
    numbers: [1 , 2 , 3 , 3 , 4 , 4]
  tasks:
  - name: removing duplicates
    ansible.builtin.debug:
      mgs: "{{ numbers | unique }}"