- name: default value
  hosts: localhost
  tasks:
  - name: for default value
    ansible.builtin.debug:
      msg: Hello , {{course | default('Ansible')}}

- name: Upper case
  hosts: localhost
  vars:
    greetings: "Good Morning"
  tasks:
  - name: filter to upper case
    ansible.builtin.debug:
      msg: "Hello , {{greetings | upper}}"